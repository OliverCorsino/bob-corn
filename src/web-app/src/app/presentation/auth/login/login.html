<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md">

        <!-- Logo / branding -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold text-gray-900">Bob's Corn</h1>
            <p class="text-sm text-gray-500 mt-1">Sign in to your account</p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">

            <!-- API error banner -->
            @if (error()) {
            <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3
                   text-sm text-red-700 flex items-center gap-2">
                <span>{{ error() }}</span>
            </div>
            }

            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input formControlName="email" type="email" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   disabled:opacity-50 transition" placeholder="you@example.com" autocomplete="email" />
                    @if (fieldError('email'); as err) {
                    <p class="mt-1 text-xs text-red-600">{{ err }}</p>
                    }
                </div>

                <!-- Password -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-sm font-medium text-gray-700">Password</label>
                        <a routerLink="/auth/forgot" class="text-xs text-blue-600 hover:text-blue-800">Forgot?</a>
                    </div>
                    <input formControlName="password" type="password" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   disabled:opacity-50 transition" placeholder="••••••••" autocomplete="current-password" />
                    @if (fieldError('password'); as err) {
                    <p class="mt-1 text-xs text-red-600">{{ err }}</p>
                    }
                </div>

                <!-- Submit -->
                <button type="submit" [disabled]="isLoading()" class="w-full flex justify-center items-center gap-2 rounded-lg
                 bg-blue-600 hover:bg-blue-700 active:bg-blue-800
                 text-white text-sm font-medium py-2.5 px-4
                 transition disabled:opacity-60 disabled:cursor-not-allowed">
                    @if (isLoading()) {
                    <span class="h-4 w-4 animate-spin rounded-full border-2
                         border-white border-t-transparent"></span>
                    Signing in…
                    } @else {
                    Sign in
                    }
                </button>

            </form>
        </div>
    </div>
</div>
