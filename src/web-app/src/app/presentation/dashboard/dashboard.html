<div class="dashboard-container">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">Bob's Corn</div>
            <button (click)="logout()" class="logout-btn">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="card">
            <p-table #dt2 [value]="products()" dataKey="id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]"
                [paginator]="true" [tableStyle]="{ 'min-width': '75rem' }">
                <ng-template #caption>
                    <div class="flex">
                        <p-button icon="pi pi-shopping-cart" label="Buy fresh corn!" severity="info" [loading]="isLoading()" (onClick)="buy()" />
                    </div>
                </ng-template>
                <ng-template #header>
                    <tr>
                        <th>Purchased Date</th>
                        <th>Shipped Date</th>
                        <th>Status</th>
                    </tr>
                    <tr>
                        <th></th>
                        <th></th>
                        <th>
                            <p-columnFilter field="isShipped" matchMode="equals" [showMenu]="false">
                                <ng-template #filter let-value let-filter="filterCallback">
                                    <p-select [ngModel]="value" [options]="statuses" (onChange)="filter($event.value)" placeholder="Select Status" [showClear]="true">
                                        <ng-template let-option #item>
                                            <p-tag [value]="option.label" [severity]="getSeverity(option.value)" />
                                        </ng-template>
                                    </p-select>
                                </ng-template>
                            </p-columnFilter>
                        </th>
                    </tr>
                </ng-template>
                <ng-template #body let-product>
                    <tr>
                        <td>
                            {{ product.purchasedAt + 'Z' | date: 'dd-MM-yyyy' }}
                        </td>
                        <td>
                            {{ product.shippedAt ? (product.shippedAt + 'Z' | date: 'dd-MM-yyyy') : '-' }}
                        </td>
                        <td>
                            <p-tag [value]="getShippingStatusLabel(product)" [severity]="getSeverity(product.isShipped)" />
                        </td>
                    </tr>
                </ng-template>
                <ng-template #emptymessage>
                    <tr>
                        <td colspan="5">No corn purchases yet.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
